# Use case configuration for the LG Fx0 (MSM8926, WCD9302 over SLIMbus).
# Playback goes from MultiMedia1 to SLIMbus 0 RX. The codec mixes RX1 and
# RX2 into the RX3 interpolator, which drives the class-D speaker; both
# SLIMbus ports must have a consumer or the codec stalls the stream.

SectionVerb {
	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='RX3 MIX1 INP1' RX1"
		cset "name='RX3 MIX1 INP2' RX2"
		cset "name='SPK DAC Switch' 1"
	]

	DisableSequence [
		cset "name='SPK DAC Switch' 0"
		cset "name='RX3 MIX1 INP1' ZERO"
		cset "name='RX3 MIX1 INP2' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
